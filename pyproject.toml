[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "provlab"
version = "0.1.0"
description = "Finite relational provenance polynomials and exact Boolean possible-world evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
provlab = "provlab.__main__:main"
[tool.setuptools]
packages = ["provlab"]
